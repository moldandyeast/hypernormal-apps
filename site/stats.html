<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>the memory · stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF; --fg: #26282B; --body: #55595F; --label: #7A8087;
    --comment: #6E747B; --line: #E8E8E8; --accent: #3B5BDB; --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--body);
    font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 14px; line-height: 24px;
    max-width: 600px; margin: 0 auto; padding: 56px 24px 56px;
    transition: background-color .35s ease, color .35s ease;
  }
  a { color: var(--fg); text-underline-offset: 3px; }
  a:hover { color: var(--accent); }
  .kicker { font-size: 13px; color: var(--label); display: block; margin-bottom: 12px; }
  h1 { font-size: 22px; line-height: 30px; font-weight: 500; color: var(--fg); }
  .claimrow { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: baseline; margin: 10px 0 28px; }
  .claimrow .back { font-size: 13px; white-space: nowrap; }
  h2 { font-size: 13px; font-weight: 400; color: var(--label); margin: 22px 0 6px; }
  .total { font-size: 22px; font-weight: 500; color: var(--fg); border-top: 1px solid var(--line); padding-top: 20px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 3px 0; font-size: 13px; }
  .name { width: 72px; color: var(--fg); }
  .bar { height: 10px; border-radius: calc(var(--radius) / 3); min-width: 2px; }
  .n { color: var(--label); }
  .comment { font-size: 13px; color: var(--comment); margin-top: 16px; }
  .empty { color: var(--comment); font-size: 13px; }
  .explore { display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; font-size: 13px; margin-top: 20px; color: var(--label); }
  .explore a { color: var(--fg); }
</style>
</head>
<body>
  <span class="kicker">a face over the memory</span>
  <h1>stats</h1>
  <div class="claimrow">
    <span>same app as the timeline. different face, same doors.</span>
    <a class="back" href="/">← hypernormal apps</a>
  </div>
  <div id="out"></div>
  <p class="comment"># counted live from the log. this face wears whatever the newest entry says.</p>
  <div class="explore" id="links" hidden>
    <span>↳</span><a id="link-app" href="#">the app, raw</a><span>·</span><a id="link-timeline" href="#">face one: timeline</a>
  </div>
<script type="module">
  import { connect } from "/runtime.js";
  const ACCENTS = {
    indigo: { light: "#3B5BDB", dark: "#91A7FF" },
    green:  { light: "#2B8A3E", dark: "#8CE99A" },
    orange: { light: "#D9480F", dark: "#FFC078" },
    violet: { light: "#862E9C", dark: "#E599F7" },
    red:    { light: "#C92A2A", dark: "#FFA8A8" },
    teal:   { light: "#087F5B", dark: "#63E6BE" },
  };
  const BASE = {
    light: { bg: "#FFFFFF", fg: "#26282B", body: "#55595F", label: "#7A8087", comment: "#6E747B", line: "#E8E8E8" },
    dark:  { bg: "#0A0A0A", fg: "#C6CAD0", body: "#8F949C", label: "#6B717A", comment: "#767C84", line: "#232323" },
  };
  const RADII = { sharp: "0px", soft: "8px", round: "16px" };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Same rule as the timeline face: appearance derives from the newest look
  // in the data, with a color-scheme fallback when the memory is empty.
  function applyLook(last) {
    const mode = last?.mode ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const root = document.documentElement.style;
    for (const [k, v] of Object.entries(BASE[mode] ?? BASE.light)) root.setProperty(`--${k}`, v);
    root.setProperty("--accent", (ACCENTS[last?.accent] ?? ACCENTS.indigo)[mode]);
    root.setProperty("--radius", RADII[last?.radius] ?? RADII.soft);
    return mode;
  }

  function guardedAppUrl() {
    const raw = new URLSearchParams(location.search).get("app");
    const show = (m) => { document.getElementById("out").innerHTML = `<p class="empty"># ${esc(m)}</p>`; };
    if (!raw) { show("open this face with ?app=<same-origin app url>, for example ?app=/a/<id>."); return null; }
    let resolved; try { resolved = new URL(raw, location.origin); } catch { show("the app url could not be parsed."); return null; }
    if (resolved.origin !== location.origin) { show("this face only connects to apps on this installation."); return null; }
    return resolved.href;
  }

  function bars(counts, colorFor, total) {
    return Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([name, n]) =>
      `<div class="row"><span class="name">${esc(name)}</span>
        <span class="bar" style="background:${colorFor(name)};width:${(n / total) * 300}px"></span>
        <span class="n">${n}</span></div>`).join("");
  }

  const appUrl = guardedAppUrl();
  if (appUrl) { try {
    document.getElementById("links").hidden = false;
    document.getElementById("link-app").href = `${new URL(appUrl).pathname}/state`;
    document.getElementById("link-timeline").href = `/f/timeline?app=${new URL(appUrl).pathname}`;
    const app = await connect(appUrl, { tools: false });
    app.state.watch((s) => {
      const entries = s.entries ?? [];
      const mode = applyLook(entries[entries.length - 1]?.look);
      if (entries.length === 0) {
        document.getElementById("out").innerHTML = `<p class="empty"># no changes recorded yet. go change the look.</p>`;
        return;
      }
      const count = (key) => entries.reduce((m, e) => ((m[e.look[key]] = (m[e.look[key]] ?? 0) + 1), m), {});
      document.getElementById("out").innerHTML =
        `<div class="total">${entries.length} looks remembered</div>` +
        `<h2>by accent</h2>` + bars(count("accent"), (n) => (ACCENTS[n] ?? ACCENTS.indigo)[mode], entries.length) +
        `<h2>by mode</h2>` + bars(count("mode"), (n) => (n === "dark" ? (mode === "dark" ? "#C6CAD0" : "#26282B") : (mode === "dark" ? "#3A3F45" : "#C9CDD2")), entries.length) +
        `<h2>by corners</h2>` + bars(count("radius"), () => "var(--label)", entries.length);
    });
  } catch (e) {
    document.getElementById("out").innerHTML = `<p class="empty"># could not reach the app: ${esc(e.message)}</p>`;
  } }
</script>
</body>
</html>
